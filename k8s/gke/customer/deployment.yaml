apiVersion: apps/v1
kind: Deployment

metadata:
  name: customer
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: customer

  template:
    metadata:
      labels:
        app: customer

    spec:
      containers:
        - name: customer

          image: asia-south1-docker.pkg.dev/project-e4b58c33-b31e-44d9-a36/ecommerce-microservices/customer:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8001

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kube

            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/customer

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

            - name: SPRING_DATASOURCE_PASSWORD
              value: password

            - name: SPRING_RABBITMQ_ADDRESSES
              value: rabbitmq:5672

            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411


          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
