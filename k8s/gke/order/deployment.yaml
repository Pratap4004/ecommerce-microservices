apiVersion: apps/v1
kind: Deployment

metadata:
  name: order
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order

  template:
    metadata:
      labels:
        app: order

    spec:
      containers:
        - name: order

          image: asia-south1-docker.pkg.dev/project-e4b58c33-b31e-44d9-a36/ecommerce-microservices/order:753d0d0f9ada4f9fb48d54e4222df176095a8ed8

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8003

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kube

            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/orders

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

            - name: SPRING_DATASOURCE_PASSWORD
              value: password

            - name: SPRING_RABBITMQ_ADDRESSES
              value: rabbitmq:5672

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
