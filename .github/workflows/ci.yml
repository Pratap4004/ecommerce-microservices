name: Java CI


on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest


    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          chache: maven

      - name: Build and test
        run: mvn clean verify
