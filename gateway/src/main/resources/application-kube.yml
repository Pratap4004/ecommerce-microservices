# Server
server:
  port: 8006

# Management
management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

# Spring
spring:
  application:
    name: gateway

  zipkin:
    base-url: http://zipkin:9411

  cloud:
    gateway:
      routes:

        - id: customer
          uri: http://customer
          predicates:
            - Path=/customer/api/v1/customers/**

        - id: product
          uri: http://product
          predicates:
            - Path=/product/api/v1/products/**

        - id: order
          uri: http://order
          predicates:
            - Path=/order/api/v1/orders/**

        - id: payment
          uri: http://payment
          predicates:
            - Path=/payment/api/v1/payments/**

        - id: notification
          uri: http://notification
          predicates:
            - Path=/notification/api/v1/notifications/**
